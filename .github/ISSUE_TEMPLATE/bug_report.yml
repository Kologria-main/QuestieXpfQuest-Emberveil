name: Bug report
description: Report incorrect quest, tracker, world-map, or minimap behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: KoQuest version
      placeholder: 2.0.0-beta1.21
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Emberveil client/build
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux/Wine, Linux/Proton, Other]
    validations:
      required: true
  - type: dropdown
    id: locale
    attributes:
      label: Client language
      options: [English (enUS), Russian (ruRU), Chinese Simplified (zhCN), Chinese Traditional (zhTW), Other]
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Character and location context
      description: Faction, level, zone, subzone/building, and instance type. Do not include private account details.
    validations:
      required: true
  - type: textarea
    id: quest
    attributes:
      label: Quest/objective
      description: Exact quest name and objective text, if applicable.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: /koquest diagnostics
      render: text
    validations:
      required: true
  - type: textarea
    id: addons
    attributes:
      label: Other enabled addons
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, email addresses, and private server information.
          required: true
