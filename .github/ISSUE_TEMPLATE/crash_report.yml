name: Crash report
description: Report a reproducible Emberveil client crash associated with the addon.
title: "[Crash]: "
labels: [crash]
body:
  - type: markdown
    attributes:
      value: Disable the addon if it repeatedly crashes the client. Never post credentials or private account information.
  - type: input
    id: version
    attributes:
      label: KoQuest version
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Emberveil client/build
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux/Wine, Linux/Proton, Other]
    validations:
      required: true
  - type: dropdown
    id: locale
    attributes:
      label: Client language
      options: [English (enUS), Russian (ruRU), Chinese Simplified (zhCN), Chinese Traditional (zhTW), Other]
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: Last action before the crash
    validations:
      required: true
  - type: dropdown
    id: reproducible
    attributes:
      label: Reproducibility
      options:
        - Every time
        - Intermittent
        - Once
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: addons
    attributes:
      label: Other enabled addons and results with only pfQuest enabled
  - type: textarea
    id: diagnostics
    attributes:
      label: Last available /koquest output
      render: text
  - type: textarea
    id: log
    attributes:
      label: Relevant crash-log excerpt
      description: Attach the file if large; redact personal information.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, email addresses, and private server information.
          required: true
